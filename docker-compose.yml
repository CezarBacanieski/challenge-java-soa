services:
  postgres:
    image: postgres:16
    container_name: ford-vinshare-postgres
    environment:
      POSTGRES_DB: fordvinshare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ford_vinshare_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fordvinshare"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ford_vinshare_postgres_data:
