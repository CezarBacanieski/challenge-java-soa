spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# base64 of 32 bytes: 000102...1f
app.security.jwt.hmac-secret-base64=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
app.security.jwt.access-ttl-seconds=60
app.security.jwt.refresh-ttl-seconds=3600

app.security.cors.allowed-origins=http://localhost
app.security.rate-limit.per-ip-per-minute=1000
app.security.rate-limit.per-user-per-minute=1000
app.security.rate-limit.auth-per-ip-per-minute=1000

app.security.cookies.secure=false
app.security.cookies.same-site=Strict

app.security.payload-signature.enabled=false

