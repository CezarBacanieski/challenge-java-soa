spring.application.name=ford-vinshare

# Banco de dados (valores padrao para desenvolvimento; em producao use variaveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fordvinshare}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Erros ja tratados pelo GlobalExceptionHandler (inclusive 401/403) nao geram WARN no log
spring.mvc.log-resolved-exception=false

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# JWT
# A chave deve ser Base64 com pelo menos 256 bits. Em producao, defina JWT_SECRET no ambiente.
jwt.secret=${JWT_SECRET:iBLfI8JLvrFPQMwh1/UYpLuDok+6V2SkkPpccY43VTreNURzvwcZLec58cHXsBa6}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
jwt.issuer=ford-vinshare-api

# Carga inicial de concessionarias e usuarios de teste
app.seed.enabled=${APP_SEED_ENABLED:true}
