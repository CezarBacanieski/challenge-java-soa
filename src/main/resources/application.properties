spring.application.name=ford-vinshare

# -----------------------------
# Database (no hardcoded secrets)
# -----------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fordvinshare}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:change-me}

# Safer defaults (override via profile if needed)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------
# JSON / Input hardening
# -----------------------------
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true
spring.jackson.mapper.accept-case-insensitive-properties=false
spring.jackson.mapper.accept-case-insensitive-enums=false

# Keep JSON bombs under control (Jackson 2.17+)
spring.jackson.parser.max-nesting-depth=50
spring.jackson.parser.max-string-length=20000
spring.jackson.parser.max-number-length=1000

# Request sizes (no uploads in this project, but keep sane limits)
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB

# -----------------------------
# Error handling (no stack traces)
# -----------------------------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.include-stacktrace=never

# -----------------------------
# OpenAPI/Swagger
# -----------------------------
springdoc.swagger-ui.path=/swagger-ui.html

# -----------------------------
# App Security (JWT, CORS, rate limit)
# -----------------------------
app.security.jwt.hmac-secret-base64=${APP_JWT_SECRET_BASE64:}
app.security.jwt.access-ttl-seconds=${APP_ACCESS_TTL_SECONDS:300}
app.security.jwt.refresh-ttl-seconds=${APP_REFRESH_TTL_SECONDS:604800}

app.security.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app.security.rate-limit.per-ip-per-minute=${APP_RL_IP_PER_MIN:120}
app.security.rate-limit.per-user-per-minute=${APP_RL_USER_PER_MIN:240}
app.security.rate-limit.auth-per-ip-per-minute=${APP_RL_AUTH_IP_PER_MIN:15}

# Cookies for refresh token (HttpOnly always). Secure should be true when behind HTTPS.
app.security.cookies.secure=${APP_COOKIES_SECURE:false}
app.security.cookies.same-site=${APP_COOKIES_SAMESITE:Strict}

# Optional payload signature verification (HMAC over raw body)
app.security.payload-signature.enabled=${APP_PAYLOAD_SIG_ENABLED:false}
app.security.payload-signature.hmac-secret-base64=${APP_PAYLOAD_HMAC_SECRET_BASE64:}

# -----------------------------
# Data-at-rest encryption
# -----------------------------
app.crypto.encryption-key=${APP_CRYPTO_KEY_BASE64:}
